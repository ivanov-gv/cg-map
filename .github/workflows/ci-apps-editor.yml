name: ci-apps-editor
# The source viewer: its checks, artifact and browser tests, split so that each job stays inside the job time limit.
on:
  workflow_call:
    inputs:
      test_run:
        type: boolean
        required: true
      phone_tests:
        description: On the phone layout, run only tests tagged @phone, or all.
        type: string
        default: tagged
      browser_matrix:
        description: The browser areas to run, from the planner. Empty runs them all.
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      test_run:
        description: Test run
        type: boolean
        default: true
      phone_tests:
        description: On the phone layout, run only tests tagged @phone, or all.
        type: string
        default: tagged
permissions:
  contents: read
  packages: read
jobs:
  verify:
    name: Verify editor
    if: ${{ inputs.test_run != true && inputs.test_run != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: dev
    outputs: &verify-outputs
      browser_matrix: ${{ steps.areas.outputs.editor_browser_matrix }}
    env: &verify-env
      BROWSER_MATRIX: ${{ inputs.browser_matrix }}
    steps: &verify-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/run-check
        with:
          command: make verify PKG=apps/editor
      - name: Select browser areas
        id: areas
        run: |
          if [ -n "$BROWSER_MATRIX" ]; then
            echo "editor_browser_matrix=$BROWSER_MATRIX" | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          else
            node platform/tools/ci-plan.mjs --all
          fi
      # Not v6: act's artifact server rejects its uploads as unauthorized, and these jobs must also run locally.
      - name: Share the built artifact with the browser jobs
        uses: actions/upload-artifact@v5
        with:
          name: editor-artifact
          path: dist/editor
          include-hidden-files: true
          retention-days: 1
  verify-test-run:
    name: (test-run) Verify editor
    if: ${{ inputs.test_run == true || inputs.test_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: test-run
    outputs: *verify-outputs
    env: *verify-env
    steps: *verify-steps
  browser:
    name: Browser tests (${{ matrix.area }})
    needs: verify
    # A change such as an editor unit test needs the editor checks but no browser area.
    if: ${{ needs.verify.outputs.browser_matrix != '{"include":[]}' }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ivanov-gv/cg-map/browser-ci:1.56.1-r1
      # Private, and this repository has access: without credentials a job's container is pulled anonymously.
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # Set only on a local run with a GPU: see the Makefile.
      options: ${{ vars.BROWSER_CONTAINER_OPTIONS }}
    timeout-minutes: 7
    environment: dev
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.browser_matrix) }}
    env: &browser-env
      # Each job has its own 4 CPUs.
      E2E_WORKERS: 2
      E2E_PHONE: ${{ inputs.phone_tests }}
      AREA: ${{ matrix.area }}
      E2E_SPECS: ${{ matrix.specs }}
    steps: &browser-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-dependencies
      - uses: actions/download-artifact@v8
        with:
          name: editor-artifact
          path: dist/editor
      - uses: ./.github/actions/run-check
        with:
          command: make -C apps/editor e2e-built E2E_ARGS="$E2E_SPECS"
      # Not v6: act's artifact server rejects its uploads as unauthorized, and these jobs must also run locally.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: browser-failure-evidence-editor-${{ env.AREA }}
          path: apps/editor/test-results/
          retention-days: 7
  browser-test-run:
    name: (test-run) Browser tests (${{ matrix.area }})
    needs: verify-test-run
    if: ${{ needs.verify-test-run.outputs.browser_matrix != '{"include":[]}' }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ivanov-gv/cg-map/browser-ci:1.56.1-r1
      # Private, and this repository has access: without credentials a job's container is pulled anonymously.
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # Set only on a local run with a GPU: see the Makefile.
      options: ${{ vars.BROWSER_CONTAINER_OPTIONS }}
    timeout-minutes: 7
    environment: test-run
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-test-run.outputs.browser_matrix) }}
    env: *browser-env
    steps: *browser-steps
