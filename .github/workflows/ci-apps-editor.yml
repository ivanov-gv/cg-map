name: ci-apps-editor
# The source viewer: its checks, artifact and browser tests, split into app-owned shards so each job stays inside the
# job time limit.
on:
  workflow_call:
    inputs:
      test_run:
        type: boolean
        required: true
      phone_tests:
        description: On the phone layout, run only tests tagged @phone, or all.
        type: string
        default: tagged
      smoke:
        description: On a test run, prove the browser job with only the first shard.
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      test_run:
        description: Test run
        type: boolean
        default: true
      phone_tests:
        description: On the phone layout, run only tests tagged @phone, or all.
        type: string
        default: tagged
      smoke:
        description: Run only the first browser shard.
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
jobs:
  verify:
    name: Verify editor
    if: ${{ inputs.test_run != true && inputs.test_run != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs: &verify-outputs
      browser_matrix: ${{ steps.matrix.outputs.browser_matrix }}
    env: &verify-env
      SMOKE: ${{ inputs.smoke }}
    steps: &verify-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/run-check
        with:
          command: make verify PKG=apps/editor
      - name: Build browser matrix
        id: matrix
        run: |
          if [ "$SMOKE" = true ] || [ "$SMOKE" = 'true' ]; then
            matrix="$(node apps/editor/tools/browser-matrix.mjs --smoke)"
          else
            matrix="$(node apps/editor/tools/browser-matrix.mjs)"
          fi
          echo "browser_matrix=$matrix" | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
      # Not v6: act's artifact server rejects its uploads as unauthorized, and these jobs must also run locally.
      - name: Share the built artifact with the browser jobs
        uses: actions/upload-artifact@v5
        with:
          name: editor-artifact
          path: dist/editor
          include-hidden-files: true
          retention-days: 1
  verify-test-run:
    name: (test-run) Verify editor
    if: ${{ inputs.test_run == true || inputs.test_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: test-run
      deployment: false
    outputs: *verify-outputs
    env: *verify-env
    steps: *verify-steps
  browser:
    name: Browser tests (${{ matrix.shard }}/${{ matrix.jobs }})
    needs: verify
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ivanov-gv/cg-map/browser-ci:1.56.1-r1
      # Private, and this repository has access: without credentials a job's container is pulled anonymously.
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # Set only on a local run with a GPU: see the Makefile.
      options: ${{ vars.BROWSER_CONTAINER_OPTIONS }}
    timeout-minutes: 7
    environment:
      name: dev
      deployment: false
    strategy:
      fail-fast: false
      # act (nektos/act) evaluates the matrix expression before `needs` outputs exist in called workflows,
      # producing a literal string that fails JSON parsing and creates a phantom job (nektos/act#2313, #927).
      # The fallback keeps one shard parseable; the matrix tool never returns an empty list.
      matrix: ${{ fromJSON(needs.verify.outputs.browser_matrix || '{"include":[{"shard":1,"jobs":1}]}') }}
    env: &browser-env
      # Each job has its own 4 CPUs.
      E2E_WORKERS: 2
      E2E_PHONE: ${{ inputs.phone_tests }}
      AREA: shard-${{ matrix.shard }}
      SHARD: ${{ matrix.shard }}
      JOBS: ${{ matrix.jobs }}
    steps: &browser-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-dependencies
      - uses: actions/download-artifact@v8
        with:
          name: editor-artifact
          path: dist/editor
      - uses: ./.github/actions/run-check
        with:
          command: make -C apps/editor e2e-built E2E_ARGS="--shard=$SHARD/$JOBS"
      # Not v6: act's artifact server rejects its uploads as unauthorized, and these jobs must also run locally.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: browser-failure-evidence-editor-${{ env.AREA }}
          path: apps/editor/test-results/
          retention-days: 7
  browser-test-run:
    name: (test-run) Browser tests (${{ matrix.shard }}/${{ matrix.jobs }})
    needs: verify-test-run
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ivanov-gv/cg-map/browser-ci:1.56.1-r1
      # Private, and this repository has access: without credentials a job's container is pulled anonymously.
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # Set only on a local run with a GPU: see the Makefile.
      options: ${{ vars.BROWSER_CONTAINER_OPTIONS }}
    timeout-minutes: 7
    environment:
      name: test-run
      deployment: false
    strategy:
      fail-fast: false
      # The same act fallback as the regular job: see its comment above.
      matrix: ${{ fromJSON(needs.verify-test-run.outputs.browser_matrix || '{"include":[{"shard":1,"jobs":1}]}') }}
    env: *browser-env
    steps: *browser-steps
