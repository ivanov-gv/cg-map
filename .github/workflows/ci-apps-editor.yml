name: ci-apps-editor
# The source viewer: its checks, artifact and browser tests, split so that each job stays inside the job time limit.
on:
  workflow_call:
    inputs:
      test_run:
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      test_run:
        description: Test run
        type: boolean
        default: true
permissions:
  contents: read
  packages: read
jobs:
  verify:
    name: Verify editor
    if: ${{ inputs.test_run != true && inputs.test_run != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: dev
    steps: &verify-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/run-check
        with:
          command: make verify PKG=apps/editor
      # Not v6: act's artifact server rejects its uploads as unauthorized, and these jobs must also run locally.
      - name: Share the built artifact with the browser jobs
        uses: actions/upload-artifact@v5
        with:
          name: editor-artifact
          path: dist/editor
          include-hidden-files: true
          retention-days: 1
  verify-test-run:
    name: (test-run) Verify editor
    if: ${{ inputs.test_run == true || inputs.test_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: test-run
    steps: *verify-steps
  browser:
    name: Browser tests (${{ matrix.area }})
    needs: verify
    # Pinned: ubuntu-latest is 26.04, for which Playwright 1.56 has no Chromium build.
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: dev
    strategy:
      fail-fast: false
      # Sized from measured test time: a new area when one nears the job time limit. Together these must cover every spec
      # in both projects, which platform/tests/workflows.test.mjs checks.
      matrix: &browser-matrix
        include:
          - area: editing-desktop-1
            specs: tests/e2e/editing.spec.mjs --project=root-desktop --shard=1/2
          - area: editing-desktop-2
            specs: tests/e2e/editing.spec.mjs --project=root-desktop --shard=2/2
          - area: editing-mobile
            specs: tests/e2e/editing.spec.mjs --project=pages-mobile
          - area: offline-desktop
            specs: tests/e2e/offline.spec.mjs --project=root-desktop
          - area: offline-mobile
            specs: tests/e2e/offline.spec.mjs --project=pages-mobile
          - area: viewer-and-sketch
            specs: tests/e2e/viewer.spec.mjs tests/e2e/sketch.spec.mjs
    env: &browser-env
      # Each job has its own 4 CPUs.
      E2E_WORKERS: 2
      AREA: ${{ matrix.area }}
      E2E_SPECS: ${{ matrix.specs }}
    steps: &browser-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: actions/download-artifact@v8
        with:
          name: editor-artifact
          path: dist/editor
      - uses: ./.github/actions/setup-browser
      - uses: ./.github/actions/run-check
        with:
          command: make -C apps/editor e2e-built E2E_ARGS="$E2E_SPECS"
      # Not v6: act's artifact server rejects its uploads as unauthorized, and these jobs must also run locally.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: browser-failure-evidence-editor-${{ env.AREA }}
          path: apps/editor/test-results/
          retention-days: 7
  browser-test-run:
    name: (test-run) Browser tests (${{ matrix.area }})
    needs: verify-test-run
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: test-run
    strategy:
      fail-fast: false
      matrix: *browser-matrix
    env: *browser-env
    steps: *browser-steps
