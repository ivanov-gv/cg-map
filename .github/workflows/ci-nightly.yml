name: ci-nightly
# Nightly full run: catches planning mistakes and PRs that pass alone but break together.
# Reuses ci-pr-checks so there is only one job list to maintain — no copies, no drift.
on:
  # Paused by the owner on 2026-11-21 (issue #319): not needed yet. Uncomment both lines to run nightly again.
  # schedule:
  #   - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      test_run:
        description: Test run
        type: boolean
        default: true
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-nightly
  cancel-in-progress: false
jobs:
  run:
    name: Run all checks
    uses: ./.github/workflows/ci-pr-checks.yml
    # ci-pr-checks statically needs write scopes for its reusable calls, even when no test run is selected.
    permissions:
      actions: write
      contents: read
      packages: write
      pull-requests: read
    with:
      test_run: ${{ inputs.test_run == true || inputs.test_run == 'true' }}
      run_all: true
      phone_tests: all
