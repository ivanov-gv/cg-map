name: ci-map-core
# The shared map runtime, its assets and its build helpers.
on:
  workflow_call:
    inputs:
      test_run:
        type: boolean
        required: true
      publish_package:
        description: Publish the dev package after the checks pass, for a release to promote.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      test_run:
        description: Test run
        type: boolean
        default: true
      publish_package:
        description: Publish the dev package after the checks pass, for a release to promote.
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
jobs:
  verify:
    name: Verify map-core
    if: ${{ inputs.test_run != true && inputs.test_run != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: dev
    env: &verify-env
      PACKAGE_PUBLISH_FLAGS: ${{ vars.PACKAGE_PUBLISH_FLAGS }}
    permissions: &verify-permissions
      contents: read
      packages: write
    steps: &verify-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/run-check
        with:
          command: make verify PKG=packages/map-core
      - uses: ./.github/actions/publish-dev-package
        if: ${{ inputs.publish_package == true || inputs.publish_package == 'true' }}
        with:
          directory: packages/map-core
          flags: ${{ env.PACKAGE_PUBLISH_FLAGS }}
          token: ${{ github.token }}
  verify-test-run:
    name: (test-run) Verify map-core
    if: ${{ inputs.test_run == true || inputs.test_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: test-run
    env: *verify-env
    permissions: *verify-permissions
    steps: *verify-steps
