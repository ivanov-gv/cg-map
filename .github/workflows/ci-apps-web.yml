name: ci-apps-web
# Verifies the web app and its built artifact, then runs browser tests on that artifact, one job per area.
on:
  workflow_call:
    inputs:
      test_run:
        type: boolean
        required: true
      phone_tests:
        description: On the phone layout, run only tests tagged @phone, or all.
        type: string
        default: tagged
      browser_matrix:
        description: The browser areas to run, from the planner. Empty runs them all.
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      test_run:
        description: Test run
        type: boolean
        default: true
      phone_tests:
        description: On the phone layout, run only tests tagged @phone, or all.
        type: string
        default: tagged
permissions:
  contents: read
  packages: read
jobs:
  verify:
    name: Verify web
    if: ${{ inputs.test_run != true && inputs.test_run != 'true' }}
    # The same system as the browser image.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: dev
    outputs: &verify-outputs
      browser_matrix: ${{ steps.areas.outputs.browser_matrix }}
    env: &verify-env
      WEB_ARTIFACT_NAME: ${{ vars.WEB_ARTIFACT_NAME }}
      WEB_ARTIFACT_RETENTION_DAYS: ${{ vars.WEB_ARTIFACT_RETENTION_DAYS }}
      BROWSER_MATRIX: ${{ inputs.browser_matrix }}
    steps: &verify-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/run-check
        with:
          command: make verify PKG=apps/web
      - name: Select browser areas
        id: areas
        run: |
          if [ -n "$BROWSER_MATRIX" ]; then
            echo "browser_matrix=$BROWSER_MATRIX" | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
          else
            node platform/tools/ci-plan.mjs --all
          fi
      # Not v6: act's artifact server rejects its uploads as unauthorized, and these jobs must also run locally.
      - name: Share the built artifact with the browser jobs
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.WEB_ARTIFACT_NAME }}
          path: dist/web
          include-hidden-files: true
          retention-days: ${{ env.WEB_ARTIFACT_RETENTION_DAYS }}
  verify-test-run:
    name: (test-run) Verify web
    if: ${{ inputs.test_run == true || inputs.test_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: test-run
    outputs: *verify-outputs
    env: *verify-env
    steps: *verify-steps
  browser:
    name: Browser tests (${{ matrix.area }})
    needs: verify
    # A change such as a web unit test needs the web checks but no browser area.
    if: ${{ needs.verify.outputs.browser_matrix != '{"include":[]}' }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ivanov-gv/cg-map/browser-ci:1.56.1-r1
      # Set only on a local run with a GPU: see the Makefile.
      options: ${{ vars.BROWSER_CONTAINER_OPTIONS }}
    timeout-minutes: 7
    environment: dev
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.browser_matrix) }}
    env: &browser-env
      # Each job has its own 4 CPUs, and one worker left the slowest area at the job time limit.
      E2E_WORKERS: 2
      E2E_PHONE: ${{ inputs.phone_tests }}
      AREA: ${{ matrix.area }}
      E2E_SPECS: ${{ matrix.specs }}
      WEB_ARTIFACT_NAME: ${{ vars.WEB_ARTIFACT_NAME }}
    steps: &browser-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-dependencies
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.WEB_ARTIFACT_NAME }}
          path: dist/web
      - uses: ./.github/actions/run-check
        with:
          command: make -C apps/web e2e-built E2E_ARGS="$E2E_SPECS"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: browser-failure-evidence-${{ env.AREA }}
          path: apps/web/test-results/
          retention-days: 7
  browser-test-run:
    name: (test-run) Browser tests (${{ matrix.area }})
    needs: verify-test-run
    if: ${{ needs.verify-test-run.outputs.browser_matrix != '{"include":[]}' }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ivanov-gv/cg-map/browser-ci:1.56.1-r1
      # Set only on a local run with a GPU: see the Makefile.
      options: ${{ vars.BROWSER_CONTAINER_OPTIONS }}
    timeout-minutes: 7
    environment: test-run
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-test-run.outputs.browser_matrix) }}
    env: *browser-env
    steps: *browser-steps
