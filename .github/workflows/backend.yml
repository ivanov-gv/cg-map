name: Backend checks
on:
  push:
    branches: [main]
    paths:
      - 'services/backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'services/backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/backend/go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o "${RUNNER_TEMP}/kompas" ./cmd/server
