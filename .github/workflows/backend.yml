name: Backend checks
on:
  push:
    branches: [main]
    paths:
      - 'services/backend/**'
      - 'packages/contracts/**'
      - 'Makefile'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'services/backend/**'
      - 'packages/contracts/**'
      - 'Makefile'
      - '.github/workflows/backend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/backend/go.mod
          cache: false
      # Same target as local checks: gofmt, vet, test, build.
      - run: make check-go
