name: ci-dev-pages
# Pages is the dev environment: every merge to main shows main there. This workflow builds the site from source
# (not from images), uploads the artifact, and deploys it in a temporary deploy job until #168 moves deployment
# to a CD workflow. See ADR 0017.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && format('ci-dev-pages test_run={0}', inputs.test_run)
  || format('ci-dev-pages {0}', github.sha) }}
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_run:
        description: Test run
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  switch:
    name: Test-run switch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test_run: ${{ steps.test_run.outputs.test_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: test_run
        uses: ./.github/actions/test_run
        with:
          test_run: ${{ inputs.test_run }}

  build:
    name: Build dev site
    needs: switch
    if: ${{ !cancelled() && needs.switch.outputs.test_run != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions: &build-permissions
      contents: read
      packages: read
    outputs: &build-outputs
      is_newest: ${{ steps.newest.outputs.is_newest }}
    steps: &build-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - name: Build each app
        run: |
          mkdir site
          cp platform/pages/index.html site/index.html
          for app in web editor core-demo; do
            echo "::group::Build $app"
            start=$SECONDS
            make -C "apps/$app" build
            echo "::endgroup::"
            duration=$((SECONDS - start))
            echo "$app: built in ${duration}s" | tee -a "$GITHUB_STEP_SUMMARY"
            cp -r "dist/$app" "site/$app"
          done
      - name: Write version.json
        run: |
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > site/version.json <<EOF
          {"commit":"${GITHUB_SHA}","run_id":"${GITHUB_RUN_ID}","built_at":"${built_at}"}
          EOF
          echo "version.json:" | tee -a "$GITHUB_STEP_SUMMARY"
          cat site/version.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Site file count
        run: |
          count=$(find site -type f | wc -l)
          echo "Files in the site: $count" | tee -a "$GITHUB_STEP_SUMMARY"
      # main's runs do not queue behind each other, so a slow older run could otherwise replace a newer site.
      - id: newest
        name: Check this is still main's newest commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          main_head=$(curl --fail --silent --show-error --location --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/commits/main" | jq -r .sha)
          is_newest=$([ "$main_head" = "$GITHUB_SHA" ] && echo true || echo false)
          echo "is_newest=$is_newest" >> "$GITHUB_OUTPUT"
          echo "main is at $main_head, this run is $GITHUB_SHA: deploying is $is_newest" | tee -a "$GITHUB_STEP_SUMMARY"
      # Not v5: act's artifact server rejects what it uploads, and this job must also run locally.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  build-test-run:
    name: (test-run) Build dev site
    needs: switch
    if: ${{ !cancelled() && needs.switch.outputs.test_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: test-run
    permissions: *build-permissions
    outputs: *build-outputs
    steps: *build-steps
  # Temporary: this deploy job will move to a CD workflow (#168). Kept here so the dev site still updates on push.
  # No test-run twin: deploy-pages can only publish to this repository, so Pages has no test-run destination.
  deploy:
    name: Deploy dev site
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.is_newest == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: dev-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
