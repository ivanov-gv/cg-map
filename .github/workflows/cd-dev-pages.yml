name: cd-dev-pages
# Deploys the dev site from the ci-publish dev-pages image. CI builds the site image tagged by commit SHA;
# this CD workflow pulls that image, extracts the site, and deploys it to GitHub Pages.
# Triggered by workflow_run when ci-publish finishes on main, or by workflow_dispatch for rollback.
# CD runs only for a successful push build on main — never for a CI test run, a dispatched CI run,
# a failed or cancelled run, or any branch but main. This is an exception that follows the rule:
# CI never calls or knows about CD, and CD only acknowledges new versions.
# The find job pulls the image by commit SHA — no scripts, no lookup logic, no newest check.
# The deploy job has no test-run twin: Pages can only publish to this repository.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && format('cd-dev-pages test_run={0} {1} {2}', inputs.test_run, inputs.commit, inputs.test_id)
  || format('cd-dev-pages {0}', github.event.workflow_run.head_sha || inputs.commit || github.sha) }}
on:
  workflow_run:
    workflows: [ci-publish]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: The full commit SHA on main to deploy
        type: string
        required: false
      test_run:
        description: Test run
        type: boolean
        default: true
      test_id:
        description: Unique test-run marker, used in the run name so a waiter can identify this run
        type: string
        required: false
        default: ''
permissions: {}
jobs:
  switch:
    name: Test-run switch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      test_run: ${{ steps.test_run.outputs.test_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: test_run
        uses: ./.github/actions/test_run
        with:
          test_run: ${{ inputs.test_run }}
  find:
    name: Pull dev site image
    needs: switch
    if: ${{ !cancelled() && needs.switch.outputs.test_run != 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment:
      name: dev
      deployment: false
    permissions: &find-permissions
      contents: read
      packages: read
    env:
      IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
      COMMIT: ${{ github.event.workflow_run.head_sha || inputs.commit || github.sha }}
    outputs: &find-outputs
      commit: ${{ steps.resolve.outputs.commit }}
    steps: &find-steps
      # Only the local actions: CD never touches the application's source.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - name: Validate commit
        id: resolve
        uses: ./.github/actions/validate-commit
        with:
          commit: ${{ env.COMMIT }}
      - name: Pull dev site image
        env:
          COMMIT_SHA: ${{ steps.resolve.outputs.commit }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          image="$IMAGE_REPOSITORY/dev-pages:$COMMIT_SHA"
          case "$IMAGE_REPOSITORY" in
            ghcr.io/*) echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin ;;
          esac
          if ! docker pull "$image"; then
            echo "::error::Image $image not found: the version was never built or was cleaned up after the last 10"
            exit 1
          fi
          echo "Pulled $image" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Extract site from image
        env:
          COMMIT_SHA: ${{ steps.resolve.outputs.commit }}
        run: |
          image="$IMAGE_REPOSITORY/dev-pages:$COMMIT_SHA"
          container=$(docker create "$image")
          mkdir -p pages-dist
          # Copy /site/ contents into pages-dist/ so the site is at pages-dist/index.html,
          # not pages-dist/site/index.html or pages-dist/html/index.html.
          docker cp "$container":/site/. pages-dist/
          docker rm "$container" > /dev/null
          file_count=$(find pages-dist -type f | wc -l)
          echo "Extracted $file_count files from $image" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist
  find-test-run:
    name: (test-run) Pull dev site image
    needs: switch
    if: ${{ !cancelled() && needs.switch.outputs.test_run == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment:
      name: test-run
      deployment: false
    permissions: *find-permissions
    env:
      IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
      COMMIT: ${{ github.event.workflow_run.head_sha || inputs.commit || github.sha }}
    outputs: *find-outputs
    steps: *find-steps
  # No test-run twin: Pages can only publish to this repository, so there is no test destination.
  # The test run stops after the find-test-run job, which exercises the image pull and extract logic.
  deploy:
    name: Deploy dev site
    needs: find
    if: ${{ !cancelled() && needs.find.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: dev-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
