name: cd-dev-pages
# Deploys the dev site from the ci-dev-pages artifact. CI builds the site and uploads the artifact;
# this CD workflow finds that artifact for a given commit and deploys it to GitHub Pages.
# Triggered by workflow_run when ci-dev-pages finishes on main, or by workflow_dispatch for manual deploys.
# The find job and its test-run twin share steps via a composite action.
# The deploy job has no test-run twin: Pages can only publish to this repository, so there is no test destination.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && format('cd-dev-pages test_run={0} {1}', inputs.test_run, inputs.commit)
  || format('cd-dev-pages {0}', github.event.workflow_run.head_sha || inputs.commit || github.sha) }}
on:
  workflow_run:
    workflows: [ci-dev-pages]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit:
        description: The full commit SHA on main to deploy
        type: string
        required: false
      test_run:
        description: Test run
        type: boolean
        default: true
permissions: {}
jobs:
  switch:
    name: Test-run switch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      test_run: ${{ steps.test_run.outputs.test_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: test_run
        uses: ./.github/actions/test_run
        with:
          test_run: ${{ inputs.test_run }}
  # On workflow_run, the ci-dev-pages conclusion determines whether to proceed.
  # A failed ci-dev-pages run should not trigger a deploy attempt.
  # On workflow_dispatch this job is a no-op: manual deploys bypass the CI gate.
  gate:
    name: Gate workflow_run conclusion
    needs: switch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check ci-dev-pages conclusion
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          conclusion="${{ github.event.workflow_run.conclusion }}"
          if [ "$conclusion" != "success" ]; then
            echo "::error::ci-dev-pages concluded with '$conclusion', not deploying"
            exit 1
          fi
          echo "ci-dev-pages succeeded on ${{ github.event.workflow_run.head_branch }} at ${{ github.event.workflow_run.head_sha }}"

  find:
    name: Find Pages artifact
    needs: [switch, gate]
    if: ${{ !cancelled() && needs.switch.outputs.test_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions: &find-permissions
      actions: read
      contents: read
    outputs: &find-outputs
      is_newest: ${{ steps.find_artifact.outputs.is_newest }}
    steps: &find-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - id: find_artifact
        uses: ./.github/actions/find-pages-artifact
        with:
          commit: ${{ github.event.workflow_run.head_sha || inputs.commit || github.sha }}
          token: ${{ github.token }}
          artifact_destination: pages-dist
      # Re-upload the extracted content as this workflow's Pages artifact for the deploy job.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist
  find-test-run:
    name: (test-run) Find Pages artifact
    needs: [switch, gate]
    if: ${{ !cancelled() && needs.switch.outputs.test_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: test-run
    permissions: *find-permissions
    outputs: *find-outputs
    steps: *find-steps
  # No test-run twin: Pages can only publish to this repository, so there is no test destination.
  # The test run stops after the find-test-run job, which exercises the artifact resolution logic.
  deploy:
    name: Deploy dev site
    needs: [find, gate]
    if: ${{ !cancelled() && needs.find.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.find.outputs.is_newest == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: dev-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
