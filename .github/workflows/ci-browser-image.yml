name: ci-browser-image
# Proves the browser test image builds and starts Chromium. ci-publish pushes it after a merge.
on:
  workflow_call:
    inputs:
      test_run:
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      test_run:
        description: Test run
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  verify:
    name: Verify browser image
    if: ${{ inputs.test_run != true && inputs.test_run != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: dev
    steps: &verify-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-check
        with:
          command: make -C platform browser-image
  verify-test-run:
    name: (test-run) Verify browser image
    if: ${{ inputs.test_run == true || inputs.test_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: test-run
    steps: *verify-steps
