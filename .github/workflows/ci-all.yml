name: ci-all
# The top-level pipeline: plans what a change needs, calls each folder's workflow, and reports one CI gate.
# A PR run waits for approval on the ci-approval environment before anything runs: see .github/TESTING.md.
# A push to main runs no checks. The required, up-to-date PR run already tested exactly that content, so a push only
# publishes it. The nightly run checks everything: see docs/decisions/0006-ci-time-limits-and-tests-before-merge.md.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && format('ci-all test_run={0} run_all={1}', inputs.test_run, inputs.run_all)
  || format('ci-all {0}', github.event.pull_request.title || github.sha) }}
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly full run: catches planning mistakes and PRs that pass alone but break together.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      test_run:
        description: Test run
        type: boolean
        default: true
      run_all:
        description: Run every folder and browser area
        type: boolean
        default: true
permissions:
  contents: read
  packages: read
concurrency:
  # Only PRs share a group. GitHub keeps one pending run per group, so a shared group on main could drop a web merge's
  # run in favor of a later docs merge, whose diff would not select the web image.
  group: ci-all-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Waiting uses no minutes, and a new push replaces the waiting run. Keep every other job behind this one.
  approval:
    name: Approve CI run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ci-approval
    permissions: {}
    steps:
      - run: echo "Approved by $GITHUB_TRIGGERING_ACTOR" | tee -a "$GITHUB_STEP_SUMMARY"
  switch:
    name: Test-run switch
    needs: approval
    if: ${{ !cancelled() && (needs.approval.result == 'success' || needs.approval.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test_run: ${{ steps.test_run.outputs.test_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: test_run
        uses: ./.github/actions/test_run
        with:
          test_run: ${{ inputs.test_run }}

  plan:
    name: Plan
    needs: switch
    # A status function, because a skipped approval further up would otherwise skip this on every run but a PR.
    if: ${{ !cancelled() && needs.switch.result == 'success' && needs.switch.outputs.test_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    outputs: &plan-outputs
      docs: ${{ steps.plan.outputs.docs }}
      workflows: ${{ steps.plan.outputs.workflows }}
      platform: ${{ steps.plan.outputs.platform }}
      contracts: ${{ steps.plan.outputs.contracts }}
      browser-image: ${{ steps.plan.outputs.browser-image }}
      data: ${{ steps.plan.outputs.data }}
      backend: ${{ steps.plan.outputs.backend }}
      transit-relay: ${{ steps.plan.outputs.transit-relay }}
      tests: ${{ steps.plan.outputs.tests }}
      map-core: ${{ steps.plan.outputs.map-core }}
      apps-web: ${{ steps.plan.outputs.apps-web }}
      apps-editor: ${{ steps.plan.outputs.apps-editor }}
      apps-core-demo: ${{ steps.plan.outputs.apps-core-demo }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
      editor_browser_matrix: ${{ steps.plan.outputs.editor_browser_matrix }}
      image_matrix: ${{ steps.plan.outputs.image_matrix }}
    env: &plan-env
      PLAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
      RUN_ALL: ${{ github.event_name == 'schedule' || inputs.run_all == true || inputs.run_all == 'true' }}
    steps: &plan-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history without file contents: enough to diff names, and cheap despite the map archive.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: plan
        run: |
          if [ "$RUN_ALL" = true ]; then
            node platform/tools/ci-plan.mjs --all
          else
            node platform/tools/ci-plan.mjs --base "$PLAN_BASE"
          fi
  plan-test-run:
    name: (test-run) Plan
    needs: switch
    if: ${{ !cancelled() && needs.switch.result == 'success' && needs.switch.outputs.test_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: test-run
    outputs: *plan-outputs
    env: *plan-env
    steps: *plan-steps

  docs:
    name: docs
    needs: [switch, plan, plan-test-run]
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.plan.outputs.docs == 'true' || needs.plan-test-run.outputs.docs == 'true') }}
    uses: ./.github/workflows/ci-docs.yml
    with:
      test_run: ${{ needs.switch.outputs.test_run == 'true' }}
  workflows:
    name: workflows
    needs: [switch, plan, plan-test-run]
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.plan.outputs.workflows == 'true' || needs.plan-test-run.outputs.workflows == 'true') }}
    uses: ./.github/workflows/ci-workflows.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      test_run: ${{ needs.switch.outputs.test_run == 'true' }}
  platform:
    name: platform
    needs: [switch, plan, plan-test-run]
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.plan.outputs.platform == 'true' || needs.plan-test-run.outputs.platform == 'true') }}
    uses: ./.github/workflows/ci-platform.yml
    with:
      test_run: ${{ needs.switch.outputs.test_run == 'true' }}
  browser-image:
    name: browser-image
    needs: [switch, plan, plan-test-run]
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.plan.outputs.browser-image == 'true' || needs.plan-test-run.outputs.browser-image == 'true') }}
    uses: ./.github/workflows/ci-browser-image.yml
    with:
      test_run: ${{ needs.switch.outputs.test_run == 'true' }}
  contracts:
    name: contracts
    needs: [switch, plan, plan-test-run]
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.plan.outputs.contracts == 'true' || needs.plan-test-run.outputs.contracts == 'true') }}
    uses: ./.github/workflows/ci-contracts.yml
    with:
      test_run: ${{ needs.switch.outputs.test_run == 'true' }}
  data:
    name: data
    needs: [switch, plan, plan-test-run]
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.plan.outputs.data == 'true' || needs.plan-test-run.outputs.data == 'true') }}
    uses: ./.github/workflows/ci-data.yml
    with:
      test_run: ${{ needs.switch.outputs.test_run == 'true' }}
  backend:
    name: backend
    needs: [switch, plan, plan-test-run]
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.plan.outputs.backend == 'true' || needs.plan-test-run.outputs.backend == 'true') }}
    uses: ./.github/workflows/ci-backend.yml
    with:
      test_run: ${{ needs.switch.outputs.test_run == 'true' }}
  transit-relay:
    name: transit-relay
    needs: [switch, plan, plan-test-run]
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.plan.outputs.transit-relay == 'true' || needs.plan-test-run.outputs.transit-relay == 'true') }}
    uses: ./.github/workflows/ci-transit-relay.yml
    with:
      test_run: ${{ needs.switch.outputs.test_run == 'true' }}
  tests:
    name: tests
    needs: [switch, plan, plan-test-run]
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.plan.outputs.tests == 'true' || needs.plan-test-run.outputs.tests == 'true') }}
    uses: ./.github/workflows/ci-tests.yml
    with:
      test_run: ${{ needs.switch.outputs.test_run == 'true' }}
  map-core:
    name: map-core
    needs: [switch, plan, plan-test-run]
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.plan.outputs.map-core == 'true' || needs.plan-test-run.outputs.map-core == 'true') }}
    uses: ./.github/workflows/ci-map-core.yml
    with:
      test_run: ${{ needs.switch.outputs.test_run == 'true' }}
  apps-web:
    name: apps-web
    needs: [switch, plan, plan-test-run]
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.plan.outputs.apps-web == 'true' || needs.plan-test-run.outputs.apps-web == 'true') }}
    uses: ./.github/workflows/ci-apps-web.yml
    with:
      test_run: ${{ needs.switch.outputs.test_run == 'true' }}
      browser_matrix: ${{ needs.plan.outputs.browser_matrix || needs.plan-test-run.outputs.browser_matrix }}
      phone_tests: ${{ github.event_name == 'schedule' && 'all' || 'tagged' }}
  apps-editor:
    name: apps-editor
    needs: [switch, plan, plan-test-run]
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.plan.outputs.apps-editor == 'true' || needs.plan-test-run.outputs.apps-editor == 'true') }}
    uses: ./.github/workflows/ci-apps-editor.yml
    with:
      test_run: ${{ needs.switch.outputs.test_run == 'true' }}
      browser_matrix: ${{ needs.plan.outputs.editor_browser_matrix || needs.plan-test-run.outputs.editor_browser_matrix }}
      phone_tests: ${{ github.event_name == 'schedule' && 'all' || 'tagged' }}
  apps-core-demo:
    name: apps-core-demo
    needs: [switch, plan, plan-test-run]
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.plan.outputs.apps-core-demo == 'true' || needs.plan-test-run.outputs.apps-core-demo == 'true') }}
    uses: ./.github/workflows/ci-apps-core-demo.yml
    with:
      test_run: ${{ needs.switch.outputs.test_run == 'true' }}

  # No test-run twin: a skipped job counts as passed, so a skipped gate could report a pass under the required name.
  # It holds no permissions and only reads results. Keep this name: main's ruleset requires it.
  gate:
    name: CI gate
    if: always()
    needs: [approval, switch, plan, plan-test-run, docs, workflows, platform, browser-image, contracts, data, backend, transit-relay, tests, map-core, apps-web, apps-editor, apps-core-demo]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      RESULTS: ${{ toJSON(needs) }}
      PLAN_RESULT: ${{ needs.plan.result }}
      PLAN_TEST_RUN_RESULT: ${{ needs.plan-test-run.result }}
    steps:
      - name: Require every planned job to pass
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "- \(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Failed or cancelled: $failed"
            exit 1
          fi
          if [ "$PLAN_RESULT" != success ] && [ "$PLAN_TEST_RUN_RESULT" != success ]; then
            echo "::error::Nothing planned this run, so nothing was checked."
            exit 1
          fi
          echo "CI gate passed." | tee -a "$GITHUB_STEP_SUMMARY"

  # What a merge changed, built and pushed. A test run pushes to a temporary registry instead. No test-run twin: it only
  # calls ci-publish, which has them.
  publish:
    name: publish
    needs: [switch, plan, plan-test-run, gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && (github.event_name == 'push' || needs.switch.outputs.test_run == 'true') }}
    uses: ./.github/workflows/ci-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      test_run: ${{ needs.switch.outputs.test_run == 'true' }}
      image_matrix: ${{ needs.plan.outputs.image_matrix || needs.plan-test-run.outputs.image_matrix }}
      publish_package: ${{ needs.plan.outputs.map-core == 'true' || needs.plan-test-run.outputs.map-core == 'true' }}
      publish_browser_image: ${{ needs.plan.outputs.browser-image == 'true' || needs.plan-test-run.outputs.browser-image == 'true' }}

  # Every merge to main shows main on the dev environment. A test run stops before the actual deploy.
  dev-pages:
    name: dev-pages
    needs: [switch, gate, publish]
    # A merge that selects nothing to publish still deploys, because the chooser page comes from main itself. Whether
    # GitHub reports such a publish as success or skipped does not matter here.
    if: ${{ !cancelled() && needs.gate.result == 'success' && (github.event_name == 'push' || needs.switch.outputs.test_run == 'true') && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    uses: ./.github/workflows/ci-dev-pages.yml
    permissions:
      contents: read
      packages: read
      pages: write
      id-token: write
    with:
      test_run: ${{ needs.switch.outputs.test_run == 'true' }}

  # The aim is 5 minutes a job, and timeout-minutes stops any job at 7. This warns while there is still room to act.
  # No test-run twin: it only reads this run's timings, so a test run needs them from the same place.
  job-times:
    name: Check job times
    needs: [gate, publish, dev-pages]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      JOB_AIM_SECONDS: 300
    steps:
      - name: Warn about jobs over the aim
        run: |
          # Only a warning, including when the timings cannot be read, as under act: the timeouts are the actual limit.
          if ! slow_jobs=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" --paginate --jq \
            ".jobs[] | select(.started_at != null and .completed_at != null)
              | {name, seconds: ((.completed_at | fromdate) - (.started_at | fromdate))}
              | select(.seconds > $JOB_AIM_SECONDS) | \"\(.seconds)s \(.name)\"" 2>&1); then
            echo "::warning::Could not read job times: $slow_jobs"
            exit 0
          fi
          if [ -z "$slow_jobs" ]; then
            echo "Every finished job took $JOB_AIM_SECONDS seconds or less." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while IFS= read -r job; do
            echo "::warning::Over the aim of $JOB_AIM_SECONDS seconds: $job"
            echo "- Over the aim: $job" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$slow_jobs"
