name: ci-apps-core-demo
# The core concept app: its checks, artifact and browser tests.
on:
  workflow_call:
    inputs:
      test_run:
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      test_run:
        description: Test run
        type: boolean
        default: true
permissions:
  contents: read
  packages: read
jobs:
  verify:
    name: Verify core demo
    if: ${{ inputs.test_run != true && inputs.test_run != 'true' }}
    # Pinned: ubuntu-latest is 26.04, for which Playwright 1.56 has no Chromium build.
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: dev
    steps: &verify-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/run-check
        with:
          command: make verify PKG=apps/core-demo
      - uses: ./.github/actions/setup-browser
      - uses: ./.github/actions/run-check
        with:
          command: make -C apps/core-demo e2e-built
      # Not v6: act's artifact server rejects its uploads as unauthorized, and these jobs must also run locally.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: browser-failure-evidence-apps-core-demo
          path: apps/core-demo/test-results/
          retention-days: 7
  verify-test-run:
    name: (test-run) Verify core demo
    if: ${{ inputs.test_run == true || inputs.test_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: test-run
    steps: *verify-steps
