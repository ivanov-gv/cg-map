name: Web checks and Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'services/backend/**/*.go'
      - 'services/backend/go.mod'
      - 'services/backend/go.sum'
      - '.github/workflows/backend.yml'
  pull_request:
    paths-ignore:
      - 'services/backend/**/*.go'
      - 'services/backend/go.mod'
      - 'services/backend/go.sum'
      - '.github/workflows/backend.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    name: Build and verify web artifact
    # Pinned: ubuntu-latest is 26.04, for which Playwright 1.56 has no Chromium build.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - run: make check
      - name: Share the built artifact with the browser jobs
        uses: actions/upload-artifact@v6
        with:
          name: web-artifact
          path: dist/web
          include-hidden-files: true
          retention-days: 1
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web
  # Each area of the app has its own job and time limit. docs/verification/testing.md maps areas to the code they cover.
  browser:
    name: Browser tests (${{ matrix.area }})
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: shell
            specs: tests/e2e/shell.spec.mjs tests/e2e/updates.spec.mjs
          - area: journeys
            specs: tests/e2e/journeys.spec.mjs
          - area: interface
            specs: tests/e2e/interface.spec.mjs
          - area: discover
            specs: tests/e2e/discover.spec.mjs
          # POI visibility is the slowest spec, so each browser project gets its own job.
          - area: poi-desktop
            specs: tests/e2e/poi-visibility.spec.mjs --project=root-desktop
          - area: poi-mobile
            specs: tests/e2e/poi-visibility.spec.mjs --project=pages-mobile
    env:
      E2E_SPECS: ${{ matrix.specs }}
      AREA: ${{ matrix.area }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: actions/download-artifact@v8
        with:
          name: web-artifact
          path: dist/web
      - uses: ./.github/actions/setup-browser
      - run: make test-e2e-built E2E_ARGS="$E2E_SPECS"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failure-evidence-${{ env.AREA }}
          path: apps/web/test-results/
          retention-days: 7
  # One stable result for deployment and branch rules, whichever browser jobs ran.
  browser-acceptance:
    name: Browser acceptance
    if: always()
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BROWSER_RESULT: ${{ needs.browser.result }}
    steps:
      - run: |
          echo "Browser jobs: $BROWSER_RESULT" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$BROWSER_RESULT" = success
  deploy:
    name: Deploy web to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [web, browser-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
