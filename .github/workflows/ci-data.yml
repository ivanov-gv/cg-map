name: ci-data
# Data sources, releases, and pipeline tools.
on:
  workflow_call:
    inputs:
      test_run:
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      test_run:
        description: Test run
        type: boolean
        default: true
permissions:
  contents: read
  packages: read
jobs:
  verify:
    name: Verify data
    if: ${{ inputs.test_run != true && inputs.test_run != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: dev
    steps: &verify-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/run-check
        with:
          command: make verify PKG=data
  verify-test-run:
    name: (test-run) Verify data
    if: ${{ inputs.test_run == true || inputs.test_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: test-run
    steps: *verify-steps
