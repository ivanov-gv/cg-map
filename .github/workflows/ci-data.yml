name: ci-data
# Data sources, releases, and pipeline tools.
on:
  workflow_call:
    inputs:
      test_run:
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      test_run:
        description: Test run
        type: boolean
        default: true
permissions:
  contents: read
  packages: read
jobs:
  verify:
    name: Verify data
    if: ${{ inputs.test_run != true && inputs.test_run != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps: &verify-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data/tools/requirements.txt
      - name: Install pinned data tools
        run: python3 -m pip install -r data/tools/requirements.txt
      - uses: ./.github/actions/run-check
        with:
          command: make verify PKG=data
  verify-test-run:
    name: (test-run) Verify data
    if: ${{ inputs.test_run == true || inputs.test_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment:
      name: test-run
      deployment: false
    steps: *verify-steps
