name: ci-workflows
# Lints workflows on every change to them. Changed CD workflows get a real test run through ci-pr-checks:
# see .github/TESTING.md.
on:
  workflow_call:
    inputs:
      test_run:
        type: boolean
        required: true
      cd_test_runs:
        description: JSON array of changed CD workflows that need a dispatch and wait
        type: string
        required: false
        default: '[]'
      head_sha:
        description: Commit whose changes selected the workflows
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      test_run:
        description: Test run
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - .github/**
      - platform/tools/workflow-test-runs.mjs
      - platform/tests/workflow-test-runs.test.mjs
      - platform/tests/workflows.test.mjs
      - Makefile

permissions:
  contents: read

jobs:
  lint:
    name: Lint workflows
    if: ${{ inputs.test_run != true && inputs.test_run != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: &lint-steps
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint all workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
  lint-test-run:
    name: (test-run) Lint workflows
    if: ${{ inputs.test_run == true || inputs.test_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: test-run
    steps: *lint-steps
  # The CI test runs are reusable calls in ci-pr-checks; CD workflows cannot be reusable, so this job dispatches and
  # waits for them. It has no test-run twin: a test run must not dispatch itself.
  cd-test-runs:
    name: CD workflow test runs
    if: ${{ fromJSON(inputs.cd_test_runs || '[]').length > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            platform
            package.json
            package-lock.json
            .node-version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Reuse or dispatch and wait for CD test runs
        env:
          CD_TEST_RUNS: ${{ inputs.cd_test_runs }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node platform/tools/workflow-test-runs.mjs
