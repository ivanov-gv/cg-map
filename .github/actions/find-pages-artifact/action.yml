name: Find Pages artifact
description: >-
  Resolves a commit SHA, verifies it is on main, finds the &lt;prefix&gt;-&lt;commit&gt; artifact by name
  (newest non-expired), downloads it, verifies version.json matches, and extracts it for re-upload.
  CD is independent of CI's runs: it only needs the artifact name.
inputs:
  commit:
    description: The full commit SHA to find the artifact for.
    required: true
  token:
    description: Token for the GitHub API.
    required: true
  artifact_destination:
    description: Directory to extract the downloaded artifact into.
    required: false
    default: pages-dist
  artifact_prefix:
    description: The prefix for the artifact name (e.g. dev-pages). Must be set explicitly.
    required: true
  retention_days:
    description: Artifact retention days (for error messages). Must be set explicitly.
    required: true
outputs:
  commit:
    description: The resolved commit SHA.
    value: ${{ steps.resolve.outputs.commit }}
  run_id:
    description: The workflow run ID that produced the artifact.
    value: ${{ steps.resolve_artifact.outputs.run_id }}
  is_newest:
    description: true if the commit is still main's newest commit.
    value: ${{ steps.newest.outputs.is_newest }}
runs:
  using: composite
  steps:
    - id: resolve
      name: Resolve commit
      shell: bash
      env:
        INPUT_COMMIT: ${{ inputs.commit }}
        INPUT_ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
        EVENT_SHA: ${{ github.sha }}
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        # artifact_prefix is required — fail early if it is empty.
        if [ -z "$INPUT_ARTIFACT_PREFIX" ]; then
          echo "::error::artifact_prefix is required and must not be empty"
          exit 1
        fi
        commit="${INPUT_COMMIT:-$EVENT_SHA}"
        # Validate the commit is a full 40-character SHA.
        if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::commit must be a full 40-character SHA, got: $commit"
          exit 1
        fi
        # Verify the commit is on main using the compare API.
        relation=$(curl --fail --silent --show-error --location \
          --header "Authorization: Bearer $GH_TOKEN" \
          --header "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$GH_REPO/compare/main...$commit" | jq -r .status)
        if [ "$relation" != "behind" ] && [ "$relation" != "identical" ]; then
          echo "::error::$commit is not on main ($relation). CD deploys only commits that CI built on main."
          exit 1
        fi
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
        echo "Resolved commit: $commit (relation to main: $relation)" | tee -a "$GITHUB_STEP_SUMMARY"

    - id: resolve_artifact
      name: Find artifact by name
      shell: bash
      env:
        COMMIT: ${{ steps.resolve.outputs.commit }}
        ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
        RETENTION_DAYS: ${{ inputs.retention_days }}
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        artifact_name="$ARTIFACT_PREFIX-$COMMIT"

        gh_api() {
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$1"
        }

        # List all artifacts with this name; take the newest non-expired one.
        artifacts_json=$(gh_api "https://api.github.com/repos/$GH_REPO/actions/artifacts?name=$artifact_name&per_page=100")

        # Filter to non-expired artifacts and sort by created_at descending.
        non_expired=$(echo "$artifacts_json" | jq '[.artifacts[] | select(.expired == false)]')
        count=$(echo "$non_expired" | jq 'length')

        if [ "$count" = "0" ]; then
          echo "::error::No artifact $artifact_name: it was never built on main, or it expired after its retention of $RETENTION_DAYS days"
          exit 1
        fi

        # Take the newest (first in the list, which is sorted by created_at descending by default).
        newest=$(echo "$non_expired" | jq '.[0]')
        run_id=$(echo "$newest" | jq -r '.workflow_run.id')
        artifact_id=$(echo "$newest" | jq -r '.id')

        echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
        echo "Found artifact $artifact_name (id=$artifact_id, run_id=$run_id)" | tee -a "$GITHUB_STEP_SUMMARY"

    - id: download
      name: Download Pages artifact by name
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact_prefix }}-${{ steps.resolve.outputs.commit }}
        run-id: ${{ steps.resolve_artifact.outputs.run_id }}
        path: ${{ inputs.artifact_destination }}
        github-token: ${{ inputs.token }}
        repository: ${{ github.repository }}

    - id: extract
      name: Extract artifact
      shell: bash
      env:
        ARTIFACT_DEST: ${{ inputs.artifact_destination }}
        RUN_ID: ${{ steps.resolve_artifact.outputs.run_id }}
      run: |
        # The downloaded artifact contains artifact.tar; extract it to the destination directory.
        if [ ! -f "$ARTIFACT_DEST/artifact.tar" ]; then
          echo "::error::artifact.tar not found in $ARTIFACT_DEST (run $RUN_ID). Cannot extract."
          exit 1
        fi
        tar xf "$ARTIFACT_DEST/artifact.tar" -C "$ARTIFACT_DEST"
        rm "$ARTIFACT_DEST/artifact.tar"
        file_count=$(find "$ARTIFACT_DEST" -type f | wc -l)
        echo "Extracted $file_count files from ci-dev-pages run $RUN_ID to $ARTIFACT_DEST" | tee -a "$GITHUB_STEP_SUMMARY"

    - id: verify_version
      name: Verify version.json matches expected commit
      shell: bash
      env:
        ARTIFACT_DEST: ${{ inputs.artifact_destination }}
        EXPECTED_COMMIT: ${{ steps.resolve.outputs.commit }}
      run: |
        version_file="$ARTIFACT_DEST/version.json"
        if [ ! -f "$version_file" ]; then
          echo "::error::version.json not found in extracted artifact at $version_file"
          exit 1
        fi
        actual_commit=$(jq -r '.commit' "$version_file")
        if [ "$actual_commit" != "$EXPECTED_COMMIT" ]; then
          echo "::error::version.json commit mismatch: expected $EXPECTED_COMMIT, got $actual_commit"
          exit 1
        fi
        echo "version.json commit verified: $actual_commit" | tee -a "$GITHUB_STEP_SUMMARY"

    - id: newest
      name: Check this is still main's newest commit
      shell: bash
      env:
        COMMIT: ${{ steps.resolve.outputs.commit }}
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        main_head=$(curl --fail --silent --show-error --location \
          --header "Authorization: Bearer $GH_TOKEN" \
          --header "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$GH_REPO/commits/main" | jq -r .sha)
        is_newest=$([ "$main_head" = "$COMMIT" ] && echo true || echo false)
        echo "is_newest=$is_newest" >> "$GITHUB_OUTPUT"
        echo "main is at $main_head, this commit is $COMMIT: deploy=$is_newest" | tee -a "$GITHUB_STEP_SUMMARY"
