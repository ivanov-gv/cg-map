name: Find Pages artifact
description: >-
  Resolves a commit SHA, verifies it is on main, locates the ci-dev-pages run that built it,
  downloads the github-pages artifact, and extracts it for re-upload.
  When a run ID is supplied (from workflow_run), it downloads directly without any lookup.
  When no run ID is supplied (workflow_dispatch), it performs a single lookup for a successful run.
inputs:
  commit:
    description: The full commit SHA to find the artifact for.
    required: true
  run_id:
    description: Optional ci-dev-pages run ID. When provided, downloads directly without lookup.
    required: false
  token:
    description: Token for the GitHub API.
    required: true
  artifact_destination:
    description: Directory to extract the downloaded artifact into.
    required: false
    default: pages-dist
outputs:
  commit:
    description: The resolved commit SHA.
    value: ${{ steps.resolve.outputs.commit }}
  run_id:
    description: The ci-dev-pages run ID used for the artifact.
    value: ${{ steps.resolve_run.outputs.run_id }}
  is_newest:
    description: true if the commit is still main's newest commit.
    value: ${{ steps.newest.outputs.is_newest }}
runs:
  using: composite
  steps:
    - id: resolve
      name: Resolve commit
      shell: bash
      env:
        INPUT_COMMIT: ${{ inputs.commit }}
        EVENT_SHA: ${{ github.sha }}
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        commit="${INPUT_COMMIT:-$EVENT_SHA}"
        # Validate the commit is a full 40-character SHA.
        if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::commit must be a full 40-character SHA, got: $commit"
          exit 1
        fi
        # Verify the commit is on main using the compare API.
        relation=$(curl --fail --silent --show-error --location \
          --header "Authorization: Bearer $GH_TOKEN" \
          --header "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$GH_REPO/compare/main...$commit" | jq -r .status)
        if [ "$relation" != "behind" ] && [ "$relation" != "identical" ]; then
          echo "::error::$commit is not on main ($relation). CD deploys only commits that CI built on main."
          exit 1
        fi
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
        echo "Resolved commit: $commit (relation to main: $relation)" | tee -a "$GITHUB_STEP_SUMMARY"

    - id: resolve_run
      name: Resolve ci-dev-pages run
      shell: bash
      env:
        COMMIT: ${{ steps.resolve.outputs.commit }}
        INPUT_RUN_ID: ${{ inputs.run_id }}
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        # If a run ID was provided (from workflow_run), use it directly.
        if [ -n "$INPUT_RUN_ID" ]; then
          echo "run_id=$INPUT_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using provided ci-dev-pages run $INPUT_RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # No run ID: perform a single lookup for a successful ci-dev-pages run at this commit.
        # Prefer a push-triggered run, then fall back to any successful run.
        gh_api() {
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$1"
        }

        runs_json=$(gh_api "https://api.github.com/repos/$GH_REPO/actions/runs?head_sha=$COMMIT&per_page=100" | \
          jq '[.workflow_runs[] | select(.name == "ci-dev-pages" and .head_branch == "main")]')

        run_count=$(echo "$runs_json" | jq 'length')
        if [ "$run_count" = "0" ]; then
          echo "::error::No ci-dev-pages run found for commit $COMMIT"
          exit 1
        fi

        # Prefer a push-triggered successful run.
        run_id=$(echo "$runs_json" | \
          jq -r '.[] | select(.event == "push" and .status == "completed" and .conclusion == "success") | .id' | head -1)

        # Fall back to any successful run.
        if [ -z "$run_id" ]; then
          run_id=$(echo "$runs_json" | \
            jq -r '.[] | select(.status == "completed" and .conclusion == "success") | .id' | head -1)
        fi

        if [ -z "$run_id" ]; then
          # Report the first failed run for context.
          failed_id=$(echo "$runs_json" | jq -r '.[0].id')
          failed_conclusion=$(echo "$runs_json" | \
            jq -r ".[] | select(.id == $failed_id) | .conclusion")
          echo "::error::No successful ci-dev-pages run for $COMMIT (run $failed_id: $failed_conclusion)"
          echo "Run details: https://github.com/$GH_REPO/actions/runs/$failed_id" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

        echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
        echo "Found ci-dev-pages run $run_id for commit $COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"

    - id: download
      name: Download github-pages artifact
      uses: actions/download-artifact@v8
      with:
        name: github-pages
        run-id: ${{ steps.resolve_run.outputs.run_id }}
        path: ${{ inputs.artifact_destination }}
        github-token: ${{ inputs.token }}
        repository: ${{ github.repository }}

    - id: extract
      name: Extract artifact
      shell: bash
      env:
        ARTIFACT_DEST: ${{ inputs.artifact_destination }}
        RUN_ID: ${{ steps.resolve_run.outputs.run_id }}
      run: |
        # The downloaded artifact contains artifact.tar; extract it to the destination directory.
        if [ ! -f "$ARTIFACT_DEST/artifact.tar" ]; then
          echo "::error::artifact.tar not found in $ARTIFACT_DEST (run $RUN_ID). Cannot extract."
          exit 1
        fi
        tar xf "$ARTIFACT_DEST/artifact.tar" -C "$ARTIFACT_DEST"
        rm "$ARTIFACT_DEST/artifact.tar"
        file_count=$(find "$ARTIFACT_DEST" -type f | wc -l)
        echo "Extracted $file_count files from ci-dev-pages run $RUN_ID to $ARTIFACT_DEST" | tee -a "$GITHUB_STEP_SUMMARY"

    - id: newest
      name: Check this is still main's newest commit
      shell: bash
      env:
        COMMIT: ${{ steps.resolve.outputs.commit }}
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        main_head=$(curl --fail --silent --show-error --location \
          --header "Authorization: Bearer $GH_TOKEN" \
          --header "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$GH_REPO/commits/main" | jq -r .sha)
        is_newest=$([ "$main_head" = "$COMMIT" ] && echo true || echo false)
        echo "is_newest=$is_newest" >> "$GITHUB_OUTPUT"
        echo "main is at $main_head, this commit is $COMMIT: deploy=$is_newest" | tee -a "$GITHUB_STEP_SUMMARY"
