name: Publish image
description: Build and push a Docker image tagged by commit and dev, plus main unless skipped; labels it with the revision.
inputs:
  name:
    description: The image name suffix (e.g. "web", "dev-pages").
    required: true
  repository:
    description: Where to push, without the image name. A test run resolves this to a temporary registry.
    required: true
  dockerfile:
    description: 'Path to the Dockerfile (default: apps/<name>/Dockerfile for backward compat).'
    required: false
    default: ''
  commit:
    description: 'The commit SHA to tag with (default: github.sha).'
    required: false
    default: ''
  token:
    description: Token for ghcr.io. Other registries need none.
    required: true
  skip_main_tag:
    description: Set to "true" to skip pushing the :main tag (dev-pages is addressed by SHA only).
    required: false
    default: 'false'
  context:
    description: 'Docker build context path (default: current directory).'
    required: false
    default: '.'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        IMAGE_NAME: ${{ inputs.name }}
        IMAGE_REPOSITORY: ${{ inputs.repository }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        COMMIT_SHA: ${{ inputs.commit || github.sha }}
        REGISTRY_TOKEN: ${{ inputs.token }}
        SKIP_MAIN_TAG: ${{ inputs.skip_main_tag }}
        BUILD_CONTEXT: ${{ inputs.context }}
      run: |
        image="$IMAGE_REPOSITORY/$IMAGE_NAME"
        dockerfile="${DOCKERFILE:-apps/$IMAGE_NAME/Dockerfile}"
        commit_tag="$image:$COMMIT_SHA"
        dev_tag="$image:dev"
        build_args=(--file "$dockerfile" --label "org.opencontainers.image.revision=$COMMIT_SHA" --tag "$commit_tag" --tag "$dev_tag")
        if [ "$SKIP_MAIN_TAG" != "true" ]; then
          build_args+=(--tag "$image:main")
        fi
        case "$IMAGE_REPOSITORY" in
          ghcr.io/*) echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin ;;
        esac
        docker build "${build_args[@]}" "$BUILD_CONTEXT"
        docker push "$commit_tag"
        docker push "$dev_tag"
        if [ "$SKIP_MAIN_TAG" != "true" ]; then
          docker push "$image:main"
        fi
        if [ "$SKIP_MAIN_TAG" = "true" ]; then
          echo "Published $commit_tag and $dev_tag (no main tag)" | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "Published $commit_tag, $dev_tag and main" | tee -a "$GITHUB_STEP_SUMMARY"
        fi
