name: Publish dev package
description: Publish a package folder as 0.0.0-dev.<commit> under the dev tag, for a later release to promote.
inputs:
  directory:
    description: The package folder.
    required: true
  flags:
    description: Extra npm publish flags. A test run resolves this to --dry-run.
    required: false
    default: ''
  token:
    description: Token for GitHub Packages.
    required: true
  commit:
    description: Full source commit SHA to identify the package (empty = github.sha).
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PACKAGE_DIRECTORY: ${{ inputs.directory }}
        PUBLISH_FLAGS: ${{ inputs.flags }}
        NODE_AUTH_TOKEN: ${{ inputs.token }}
        COMMIT_SHA: ${{ inputs.commit || github.sha }}
      run: |
        # A folder outside the npm workspace does not read the repository's .npmrc, so give npm its own userconfig.
        # Keep it outside the repository; npm substitutes NODE_AUTH_TOKEN, so no secret is written to disk.
        temporary_npm_userconfig="$(mktemp)"
        trap 'rm -f "$temporary_npm_userconfig"' EXIT
        chmod 600 "$temporary_npm_userconfig"
        printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$temporary_npm_userconfig"
        export NPM_CONFIG_USERCONFIG="$temporary_npm_userconfig"
        cd "$PACKAGE_DIRECTORY"
        # npm publish --dry-run skips auth, so prove the token works here in both modes.
        echo "::group::Check registry authentication"
        npm whoami --registry https://npm.pkg.github.com
        echo "::endgroup::"
        version="0.0.0-dev.$COMMIT_SHA"
        npm pkg set version="$version"
        # shellcheck disable=SC2086 # PUBLISH_FLAGS is empty or one flag.
        npm publish --ignore-scripts --tag dev $PUBLISH_FLAGS
        echo "Published $PACKAGE_DIRECTORY as $version $PUBLISH_FLAGS" | tee -a "$GITHUB_STEP_SUMMARY"
