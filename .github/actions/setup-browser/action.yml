name: Set up browser
description: Install Chromium and its system packages, failing fast when a package mirror stalls.
runs:
  using: composite
  steps:
    # A stalled mirror once held this install for 5m40s. Short apt timeouts retry instead of waiting the default 120s.
    - name: Fail fast on stalled package downloads
      shell: bash
      run: |
        printf 'Acquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "5";\n' \
          | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts
    - name: Install Chromium
      shell: bash
      run: |
        start=$SECONDS
        timeout 240 npm run browser:install --workspace @cg-map/web -- --with-deps chromium
        summary="Installed Chromium in $((SECONDS - start))s"
        echo "$summary" | tee -a "$GITHUB_STEP_SUMMARY"
