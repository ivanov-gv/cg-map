name: Set up browser
description: Install Chromium and its system packages, reusing downloads because the package mirror is often slow.
runs:
  using: composite
  steps:
    # Slow font downloads held this step for 168s and 5m40s in two jobs, against about 20s normally.
    - name: Restore browser and package downloads
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/ci-apt-archives
        key: browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Keep package downloads where the cache can read them
      shell: bash
      run: |
        archives="$HOME/.cache/ci-apt-archives"
        mkdir -p "$archives/partial"
        printf 'Dir::Cache::Archives "%s";\nBinary::apt-get::APT::Keep-Downloaded-Packages "true";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "5";\n' "$archives" \
          | sudo tee /etc/apt/apt.conf.d/99-ci-browser
    - name: Install Chromium
      shell: bash
      run: |
        # A normal install takes about 20s. A stalled mirror download rarely recovers on its own, but usually does on a
        # new connection, so several short attempts beat one long wait. All of them must leave room inside the job limit.
        attempt_limit_seconds=60
        max_attempts=3
        start=$SECONDS
        for attempt in $(seq 1 "$max_attempts"); do
          status=0
          timeout "$attempt_limit_seconds" npx --no-install playwright install --with-deps chromium || status=$?
          echo "Chromium install attempt $attempt: exit $status after $((SECONDS - start))s" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$status" -eq 0 ] && exit 0
          echo "::warning::Chromium install attempt $attempt of $max_attempts failed with exit $status"
        done
        echo "::error::Chromium install failed after $max_attempts attempts"
        exit "$status"
    # apt leaves root-owned, unreadable entries here, and the cache cannot be saved with them in place.
    - name: Make package downloads readable by the cache
      shell: bash
      run: |
        archives="$HOME/.cache/ci-apt-archives"
        sudo rm -rf "$archives/partial" "$archives/lock"
        sudo chown -R "$(id -u):$(id -g)" "$archives"
